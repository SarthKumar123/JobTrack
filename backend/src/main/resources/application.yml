spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobtrack}
    username: ${DB_USERNAME:jobtrack}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:configure-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
            scope: openid,profile,email
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
